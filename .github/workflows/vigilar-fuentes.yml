name: Vigilar fuentes de datos

on:
  schedule:
    - cron: "15 6,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vigilar-fuentes
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar fuentes
        id: watch
        run: python scripts/watch_sources.py
      - name: Actualizar datos del INE
        id: ine
        run: |
          python scripts/update_ine.py | tee ine.txt
          if [ -s ine.txt ]; then
            { echo "changes<<EOF_INE"; cat ine.txt; echo "EOF_INE"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Commit del estado
        run: |
          git config user.name "vivienda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actualizaciones.json data/actualizaciones.xml data/salarios.json data/precios.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "data: estado de fuentes $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
      - name: Abrir issue con los datos nuevos
        if: steps.watch.outputs.count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INE: ${{ steps.ine.outputs.changes }}
          TITLE: ${{ steps.watch.outputs.title }}
          BODY: ${{ steps.watch.outputs.body }}
        run: |
          gh label create datos-nuevos --color F2B200 --description "Una fuente ha publicado datos nuevos" 2>/dev/null || true
          {
            printf '%s\n\n' "$BODY"
            if [ -n "$INE" ]; then printf '**Actualizado automáticamente:**\n\n```\n%s\n```\n\n' "$INE"; fi
            printf 'Revisar la fuente, actualizar a mano los JSON de `data/` que no se actualizan solos y cerrar este issue.\n'
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md --label datos-nuevos
      - name: Aviso por Telegram (opcional)
        if: steps.watch.outputs.count != '' && env.TG_TOKEN != ''
        env:
          TITLE: ${{ steps.watch.outputs.title }}
          BODY: ${{ steps.watch.outputs.body }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=🏠 Techo: ${TITLE}
          ${BODY}" > /dev/null
