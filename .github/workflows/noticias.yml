name: Actualizar noticias

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recolectar RSS
        run: python scripts/fetch_news.py
      - name: Commit si hay cambios
        run: |
          git config user.name "vivienda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json data/medios.json data/senales.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "data: noticias $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
